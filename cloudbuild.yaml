steps:
  # Step 1: Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/icearth-v3:$COMMIT_SHA'
      - '-t'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/icearth-v3:latest'
      - '.'

  # Step 2: Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/icearth-v3'

  # Step 3: Deploy container directly to Cloud Run and route 100% traffic
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'roulet-s-law-book-icearth-platform'
      - '--image=us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/icearth-v3:$COMMIT_SHA'
      - '--region=us-east1'
      - '--project=$PROJECT_ID'
      - '--service-account=568434421085-compute@developer.gserviceaccount.com'
      - '--remove-annotations=run.googleapis.com/sources,run.googleapis.com/source-location'
      - '--to-latest'
      - '--quiet'
      - '--allow-unauthenticated'

images:
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/icearth-v3:$COMMIT_SHA'
  - 'us-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/icearth-v3:latest'

options:
  logging: CLOUD_LOGGING_ONLY
