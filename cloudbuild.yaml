substitutions:
  _IMAGE_NAME: 'us-east1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/icearth-v3:${COMMIT_SHA}'

steps:
  # Step 1: Build Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '$_IMAGE_NAME'
      - '.'

  # Step 2: Push container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '$_IMAGE_NAME'

  # Step 3: Strip stale source annotations & deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        IMAGE_URI="$1"
        SERVICE_NAME="roulet-s-law-book-icearth-platform"
        REGION="us-east1"

        echo "Exporting Cloud Run service definition..."
        if gcloud run services describe "$SERVICE_NAME" --region="$REGION" --format=export > service.yaml 2>/dev/null; then
          echo "Found existing service configuration. Stripping stale source annotations..."
          sed -i '/run\.googleapis\.com\/source/d' service.yaml
          sed -i "s|image: .*|image: $IMAGE_URI|g" service.yaml

          echo "Applying cleaned service definition..."
          gcloud run services replace service.yaml --region="$REGION" || true
        fi

        echo "Deploying container image to Cloud Run service $SERVICE_NAME..."
        gcloud run deploy "$SERVICE_NAME" \
          --image="$IMAGE_URI" \
          --region="$REGION" \
          --platform=managed \
          --quiet \
          --allow-unauthenticated
      - '_'
      - '$_IMAGE_NAME'

images:
  - '$_IMAGE_NAME'

options:
  logging: CLOUD_LOGGING_ONLY
